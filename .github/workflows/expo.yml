name: Expo companion

on:
  workflow_dispatch:
  pull_request:
    paths: ['expo/**', 'shared/**', 'companion/**', 'server/**', 'src/lib/composer-attachments.ts', 'src/components/cursor-face-data.ts', '.github/workflows/expo.yml']
  push:
    branches: [main]
    paths: ['expo/**', 'shared/**', 'companion/**', 'server/**', 'src/lib/composer-attachments.ts', 'src/components/cursor-face-data.ts', '.github/workflows/expo.yml']

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: expo
      - run: npm run typecheck && npm test && npx expo install --check
        working-directory: expo
      - run: node --experimental-strip-types expo/scripts/verify-server.ts
      - run: npm run export
        working-directory: expo
